<!DOCTYPE html>
<html>
<head>
    <title>Donors</title>
    <style>
        body{
            font-family: Arial;
            padding:30px;
            background:#f5f5f5;
        }

        h2{
            color:green;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }

        th,td{
            border:1px solid #ddd;
            padding:12px;
            text-align:left;
        }

        th{
            background:green;
            color:white;
        }

        tr:nth-child(even){
            background:#f2f2f2;
        }

        a{
            text-decoration:none;
            color:white;
            background:green;
            padding:10px 20px;
            border-radius:5px;
        }
    </style>
</head>
<body>

<h2>Registered Donors</h2>

<table>

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Email</th>
</tr>

{% for donor in donors %}
<tr>
    <td>{{ donor[0] }}</td>
    <td>{{ donor[1] }}</td>
    <td>{{ donor[2] }}</td>
</tr>
{% endfor %}

</table>

<br>

<a href="/admin">Back to Admin</a>

</body>
</html>
