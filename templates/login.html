<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container">

<div class="row justify-content-center mt-5">

<div class="col-md-5">

<div class="card shadow-lg">

<div class="card-header bg-success text-white text-center">

<h2>Login</h2>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label>Email</label>

<input
type="email"
name="email"
class="form-control"
placeholder="Enter Email"
required>

</div>

<div class="mb-3">

<label>Password</label>

<input
type="password"
name="password"
class="form-control"
placeholder="Enter Password"
required>

</div>

<div class="d-grid">

<button
type="submit"
class="btn btn-success">

Login

</button>

</div>

</form>

<hr>

<p class="text-center">

Don't have an account?

<a href="/register">

Register

</a>

</p>

</div>

</div>

</div>

</div>

</div>

</body>

</html>
