<!DOCTYPE html>
<html>
<head>

<title>Registered Volunteers</title>

<style>

body{
    font-family:Arial;
    background:#f5f5f5;
    padding:30px;
}

h2{
    color:green;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th,td{
    padding:12px;
    border:1px solid #ddd;
    text-align:left;
}

th{
    background:green;
    color:white;
}

tr:nth-child(even){
    background:#f2f2f2;
}

a{
    text-decoration:none;
    background:green;
    color:white;
    padding:10px 18px;
    border-radius:5px;
}

</style>

</head>

<body>

<h2>Registered Volunteers</h2>

<table>

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Email</th>
</tr>

{% for volunteer in volunteers %}
<tr>
    <td>{{ volunteer[0] }}</td>
    <td>{{ volunteer[1] }}</td>
    <td>{{ volunteer[2] }}</td>
</tr>
{% endfor %}

</table>

<br>

<a href="/admin">Back to Admin Dashboard</a>

</body>
</html>
